[project]
name = "agent-runtime"
version = "0.1.0"
description = "A general-purpose agent runtime: the loop, the tool boundary, the budget enforcer, the tracer, and the evaluation harness."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
agent-runtime = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime", "providers", "tools", "context", "evals", "service"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI/argparse call patterns read worse without these.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to reach into internals to force a failure class.
"tests/*" = ["SLF001"]
"evals/cases/*" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --basetemp keeps pytest's scratch space inside the repo. Some sandboxed and
# CI environments deny writes to the system temp directory, and a test suite that
# cannot create a temporary file fails for a reason that has nothing to do with
# the code under test.
addopts = "-q --strict-markers --basetemp=.pytest-tmp"
filterwarnings = [
    # Starlette warns about its own TestClient transport choice. It is their roadmap,
    # not our defect, and it drowns out warnings we can act on.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "failure_class: forces one row of the failure taxonomy",
]
