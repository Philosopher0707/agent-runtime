id: tool-timeout-required-partial
description: >-
  A required, non-idempotent tool times out. No retry — the mutation may have landed — and
  no way to continue: partial.
config: default
task: Save a note.
confirmation_token: token-abc
tools:
  write_note:
    behaviour: timeout
    side_effect: true
    idempotent: false
    optional: false
stub:
  script:
    - tool_calls:
        - name: write_note
          arguments:
            filename: a.txt
            text: hello
    - text: Saved.
expect:
  status: partial
  failure_classes: [tool_timeout]
  reason: required_tool_failed:write_note
  model_calls: 1
  tools:
    - name: write_note
      outcome: timeout
      attempts: 1
      attempt_outcomes: [timeout]
