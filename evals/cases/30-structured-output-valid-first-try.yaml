id: structured-output-valid-first-try
description: >-
  A conforming structured answer on the first attempt. No repair pass is spent, which is
  the assertion that matters: the repair machinery must not cost anything when it is not
  needed.
config: default
task: Report the total.
overrides:
  output:
    format: json
    schema:
      type: object
      required: [total, currency]
      additionalProperties: false
      properties:
        total:
          type: integer
        currency:
          type: string
          enum: [CNY, USD]
    max_repair_attempts: 1
stub:
  script:
    - text: '{"total": 42, "currency": "CNY"}'
expect:
  status: ok
  failure_classes: []
  reason: completed
  model_calls: 1
  steps: 1
  output_exact: '{"total": 42, "currency": "CNY"}'
  tools: []
