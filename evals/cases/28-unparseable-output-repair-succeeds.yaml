id: unparseable-output-repair-succeeds
description: >-
  Structured output that does not parse. One repair pass, with the parse error in the
  prompt, and the second answer is usable. The run ends ok.
config: default
task: Report the total.
overrides:
  output:
    format: json
    schema:
      type: object
      required: [total]
      properties:
        total:
          type: integer
    max_repair_attempts: 1
stub:
  script:
    - text: "The total is forty-two."
    - text: '{"total": 42}'
expect:
  status: ok
  failure_classes: []
  reason: completed
  model_calls: 2
  steps: 2
  output_exact: '{"total": 42}'
  tools: []
