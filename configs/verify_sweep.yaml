name: verify_sweep
description: >-
  Check a batch of claims by delegating.

  The first configuration that uses `spawn_agent`, and the reason the mechanism exists: a long
  claim list is a task worth splitting, and each half is a self-contained run.

  What it demonstrates, all at once:

  * **A spawned run is a run.** Each child gets its own trace, its own budget and its own tool
    set, and the parent's transcript carries the child's trace id.
  * **The budget is hierarchical.** The parent hands each child a *share of what it has left*,
    and is charged what the child actually spent. A parent that spawns twice allocates from a
    smaller remainder the second time, so a sequence of spawns cannot overspend the declared
    bound.
  * **The child does not inherit the caller's token.** `inherit_confirmation` is false, so a
    child cannot take a side effect the principal did not authorise. Turning it on is a
    one-line change a reviewer would see.
  * **Spawning is itself gated.** `spawn_agent` is a side effect, so the caller must pass a
    confirmation token for the parent to delegate at all — "may the agent spend my budget on
    tasks I did not write?" is the principal's question, not the model's.

system_prompt: |
  You check claims against sources, and you have a way to share the work.

  When you are given more than a couple of claims, split them into two halves and call
  `spawn_agent` once per half. Each spawned agent is given a complete, self-contained task —
  it cannot see this conversation — so say explicitly which claims it is checking and that it
  should check them against the sources.

  Then combine what the children reported into one set of findings, in the same order the
  claims were given to you. Do not re-check the claims yourself; report what the children
  found, and if a child failed, say so rather than filling the gap with a guess.

  You may also check a claim yourself if the batch is small. The point of delegating is to
  handle a list that is too long to do well in one pass, not to avoid work.

tools:
  - list_sources
  - read_source
  - spawn_agent

tool_options:
  list_sources:
    root: sources
  read_source:
    root: sources
  spawn_agent:
    # Which configuration a child runs. The same domain, so the child has the same tools.
    config: verify
    # A child may use a quarter of what is left. Two children cannot exceed half, and the
    # parent keeps the rest for combining.
    share: 0.4
    # Off: a child cannot take a side effect the principal did not authorise. Turning this on
    # is a decision a reviewer should see.
    inherit_confirmation: false

provider:
  kind: openai_compat
  model: stealth/space-bunny-alpha
  base_url: https://openrouter.ai/api/v1
  api_key_env: AGENT_API_KEY
  price_input_per_mtok: 0.5
  price_output_per_mtok: 1.5
  timeout_s: 60

budget:
  max_steps: 12
  max_tokens_total: 200000
  max_wall_clock_s: 600
  max_cost_usd: 0.30

context:
  max_prompt_tokens: 32000
  summarise_above_tokens: 16000
  summary_chars: 400
  max_call_chars: 4000

output:
  format: json
  schema:
    type: object
    required: [findings]
    additionalProperties: false
    properties:
      findings:
        type: array
        items:
          type: object
          required: [claim, verdict, evidence]
          additionalProperties: false
          properties:
            claim:
              type: string
            verdict:
              type: string
              enum: [supported, contradicted, absent, undecidable]
            evidence:
              type: string
            source:
              type: string

guardrails:
  max_input_chars: 20000
  untrusted_max_chars: 8000
  disclosure_prefix_chars: 120
